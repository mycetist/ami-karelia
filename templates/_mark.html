<div id="mark-{{ point.id }}">
  {% if done %}
    <p class="font-medium text-ochre">Отмечено</p>
  {% else %}
    <form hx-post="/points/{{ point.id }}/check" hx-encoding="multipart/form-data" hx-trigger="change"
          hx-target="#mark-{{ point.id }}" hx-swap="outerHTML">
      <label class="inline-block px-4 py-2 rounded-md bg-pine hover:bg-ink text-paper font-medium cursor-pointer transition-colors">
        <input type="file" name="photo" accept="image/*" hidden>
        Отметить по фото
      </label>
      <span class="htmx-indicator ml-3 text-muted">Сверяем фото…</span>
    </form>
    {% if error %}<p class="mt-2 text-sm text-red-700">{{ error }}</p>{% endif %}
  {% endif %}
</div>
